[package]
name = "lockit"
version = "0.1.0"
description = "A local, zero-knowledge password and secrets vault"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.8"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
